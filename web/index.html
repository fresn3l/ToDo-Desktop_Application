<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal &amp; Daily Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Journal &amp; Checklist</h1>
            <p class="header-subtitle">Journal entries and daily checklist data stay on this Mac (SQLite path shown below).</p>
            <nav class="tabs">
                <button type="button" class="tab-button active" data-tab="journal">Journal</button>
                <button type="button" class="tab-button" data-tab="checklist">Daily Checklist</button>
            </nav>
        </header>

        <div id="journalTab" class="tab-content active">
            <div class="journal-header">
                <h2>Write</h2>
            </div>

            <div class="journal-entry-section">
                <div class="journal-timer-container">
                    <div class="timer-display" id="timerDisplay">10:00</div>
                    <div class="timer-controls">
                        <button id="startTimer" class="btn-primary">Start Entry</button>
                        <button id="pauseTimer" class="btn-secondary" style="display: none;">Pause</button>
                        <button id="continueTimer" class="btn-secondary" style="display: none;">Continue</button>
                    </div>
                    <div class="timer-status" id="timerStatus">Ready to start</div>
                </div>

                <div class="journal-text-container">
                    <textarea
                        id="journalEntry"
                        placeholder="Start writing your journal entry... (Timer will start when you begin typing)"
                        rows="15"
                    ></textarea>
                </div>

                <div class="journal-actions">
                    <button id="saveEntry" class="btn-primary" disabled>Save Entry</button>
                    <button id="clearEntry" class="btn-secondary">Clear</button>
                </div>
            </div>

            <div class="journal-entries-section">
                <h3>Past Entries (Last 30 Days)</h3>
                <div id="journalEntriesContainer" class="journal-entries-container"></div>
            </div>
        </div>

        <div id="checklistTab" class="tab-content">
            <div class="checklist-section">
                <div class="checklist-intro">
                    <h2>Daily Checklist</h2>
                    <p class="checklist-hint">
                        Answers are stored locally for Cluny or other tools to read.
                        <span class="checklist-db-label">Database file:</span>
                        <code id="checklistDbPath" class="checklist-db-path"></code>
                    </p>
                    <button type="button" id="restartChecklist" class="btn-secondary">Start over</button>
                </div>
                <div id="checklistWizard" class="checklist-wizard"></div>
                <div class="checklist-recent">
                    <h3>Recent submissions</h3>
                    <div id="checklistRecentList" class="checklist-recent-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="eel.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
